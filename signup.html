<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NEET Spark 360</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #123b55 0%, transparent 35%),
                radial-gradient(circle at bottom right, #172c4d 0%, transparent 35%),
                #07111f;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .login-header {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 15, 28, 0.7);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 32px;
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
        }

        .brand p {
            margin: 3px 0 0;
            color: #9fb0c3;
            font-size: 12px;
        }

        .back-home {
            color: #dbeafe;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #38bdf8;
        }

        .signup-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            padding: 38px;
            border-radius: 24px;
            background: rgba(13, 28, 46, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .signup-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 50px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .signup-card h2 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .signup-card>p {
            margin: 0 0 30px;
            color: #9fb0c3;
            line-height: 1.6;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #dbeafe;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #9fb0c3;
            font-size: 13px;
        }

        .login-text a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 12px;
        }

        @media(max-width:600px) {

            .login-header {
                padding: 18px 5%;
            }

            .back-home {
                display: none;
            }

            .signup-card {
                padding: 28px 22px;
            }

            .signup-card h2 {
                font-size: 27px;
            }

        }
    </style>

</head>

<body>


    <header class="login-header">

        <div class="brand">

            <span class="brand-icon">⚛️</span>

            <div>
                <h1>NEET Spark 360</h1>
                <p>NEET Preparation in 360°</p>
            </div>

        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <main class="signup-wrapper">

        <div class="signup-card">

            <span class="signup-badge">
                🎯 STUDENT PORTAL
            </span>

            <h2>
                Create Account
            </h2>

            <p>
                Create your NEET Spark 360 account
                and start your preparation journey.
            </p>


            <form id="signupForm">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" placeholder="Enter your name" required>

                </div>


                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6"
                        required>

                </div>


                <button type="submit" class="signup-btn">
                    Create Account →
                </button>

            </form>


            <div id="message" class="message"></div>


            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </main>


    <footer>

        © 2026 NEET Spark 360

    </footer>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyBMdTUlJpQJ0VVN_6BSOD550grcdMvjuuA",

            authDomain: "neet-spark-360.firebaseapp.com",

            projectId: "neet-spark-360",

            storageBucket: "neet-spark-360.firebasestorage.app",

            messagingSenderId: "288176406464",

            appId: "1:288176406464:web:9ee7bf566420ab4d969225",

            measurementId: "G-GV7LRPYM3G"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const signupForm =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                    return;

                }


                try {

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    await updateProfile(
                        userCredential.user,
                        {
                            displayName: name
                        }
                    );


                    message.textContent =
                        "Account created successfully!";

                    message.className =
                        "message success";

                    message.style.display =
                        "block";


                    signupForm.reset();


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1500);


                } catch (error) {

                    console.log(error);


                    let errorMessage =
                        "Account creation failed.";


                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        errorMessage =
                            "This email is already registered.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        errorMessage =
                            "Please enter a valid email.";

                    }

                    else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        errorMessage =
                            "Password must be at least 6 characters.";

                    }


                    message.textContent =
                        errorMessage;

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                }

            }

        );

    </script>


</body>

</html>
